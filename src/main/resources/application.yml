server:
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework

spring:
  application:
    name: ms-appointments

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vitalpet_appointments?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# Integracion con ms-pets
pets:
  service:
    url: ${PETS_SERVICE_URL:http://localhost:8083}
  validation:
    enabled: ${PETS_VALIDATION_ENABLED:true}

# Clave usada por OpenFeign para consultar Pets
internal:
  api:
    key: ${INTERNAL_API_KEY}

# CORS del frontend
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api/appointments/v3/api-docs
