server:
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework

spring:
  application:
    name: ms-appointments
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vitalpet_appointments?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      # "update" crea y ajusta las tablas pero no borra los datos al reiniciar
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# integracion con ms-pets (lo hizo nacho)
pets:
  service:
    # url base donde corre ms-pets (ip y puerto de su ec2, o localhost:8083 en local)
    url: ${PETS_SERVICE_URL:http://localhost:8083}
  validation:
    # false = el petId se acepta sin consultar a ms-pets (modo standalone)
    # true  = se valida que la mascota exista, este activa y sea del dueno (requiere ms-pets arriba)
    enabled: ${PETS_VALIDATION_ENABLED:false}

# cors (el frontend llama directo a este servicio)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api/appointments/v3/api-docs
